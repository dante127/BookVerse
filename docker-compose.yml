services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookverse-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bookverse-network

  redis:
    image: redis:7-alpine
    container_name: bookverse-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - bookverse-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookverse-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=mssql,1433;Database=BookVerseDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true;
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - Jwt__Issuer=BookVerse
      - Jwt__Audience=BookVerseAudience
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET (>=32 bytes) in .env}
      - Jwt__ExpiryMinutes=15
      - Jwt__RefreshTokenExpirationDays=7
      - Seed__AdminEmail=${SEED_ADMIN_EMAIL:-}
      - Seed__AdminPassword=${SEED_ADMIN_PASSWORD:-}
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bookverse-network

networks:
  bookverse-network:
    driver: bridge

volumes:
  mssql_data:
  redis_data:
